<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cowork</title>
<!-- Fully offline: no web fonts, no outside scripts. Served by ui/server.py on this Mac only. -->
<style>
/* Type scale (only these sizes):
   display 40 serif | title 22 semibold | body 17 | label 14 medium | caption 12
   One card style for every panel: 12px radius, 20px padding, 1px warm gray border, no shadow
   (only the active question card has one soft shadow). No gradients, blur or emoji. */
:root {
  --bg: #F7F5EF;          /* calm cream page */
  --side: #EFECE3;        /* sidebar */
  --panel: #FFFFFF;
  --panel-2: #F3F0E8;
  --line: #DCD6C8;        /* warm gray border */
  --line-strong: #A9A293;
  --text: #1F1E1B;        /* 15:1 on cream */
  --muted: #57534A;       /* 7:1 on cream, 7.6:1 on white */
  --accent: #A3482B;      /* warm clay, 5.9:1 on white */
  --accent-soft: #F5E7E0;
  --ok: #1D6638;          /* 6.6:1 on white */
  --ok-soft: #E4F0E6;
  --bad: #A02A1F;         /* 6.9:1 on white */
  --bad-soft: #F7E4E1;
  --warn: #7D5300;        /* 6.4:1 on white */
  --warn-soft: #F8EED8;
  --focus: #1A5FD6;
  --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --display: 500 40px/1.2 var(--serif);
  --title: 600 22px/1.3 var(--sans);
  --body: 400 17px/1.5 var(--sans);
  --label: 500 14px/1.35 var(--sans);
  --caption: 400 12px/1.4 var(--sans);
  --target: 48px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: var(--body); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.caption { font: var(--caption); color: var(--muted); }

/* The one card style */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }

.app { display: grid; grid-template-columns: 260px minmax(0, 1fr) 340px; height: 100vh; }

/* ---- left column ---- */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px 16px; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 22px/1.3 var(--serif); padding: 0 8px 20px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--text); display: grid; place-items: center; }
.brand-mark svg { width: 20px; height: 20px; }
.new-task { display: flex; align-items: center; gap: 10px; width: 100%; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font: var(--body); font-weight: 600; min-height: var(--target); }
.side h3 { font: var(--label); color: var(--muted); margin: 24px 8px 6px; }
.recent { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
.recent li { padding: 10px; border-radius: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent li.now { background: var(--panel); font-weight: 600; }
.recent li .tick { color: var(--ok); margin-right: 6px; }
.side-foot { padding: 14px 8px 0; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.side-foot .note-local { font: var(--label); color: var(--muted); }

/* ---- header: one row ---- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
.strip { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; padding: 10px 24px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; min-height: 36px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font: var(--label); white-space: nowrap; }
button.chip { min-height: var(--target); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.chip.ok .dot { background: var(--ok); }
.chip.warn { border-color: var(--warn); } .chip.warn .dot { background: var(--warn); }
.chip .tag { font: var(--caption); font-weight: 600; color: var(--warn); }
.chip .chev { width: 14px; height: 14px; transition: transform .15s; }
.chip[aria-expanded="true"] .chev { transform: rotate(180deg); }

/* ---- conversation ---- */
.scroll { flex: 1; overflow-y: auto; min-height: 0; scroll-padding: 20px; }
.convo { max-width: 780px; margin: 0 auto; padding: 28px 28px 40px; }
.empty { text-align: center; padding: 14vh 20px 0; }
.empty h1 { font: var(--display); margin: 0 0 12px; }
.empty p { color: var(--muted); margin: 0 auto; max-width: 520px; }
.empty .ways { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }

.turn { margin-bottom: 32px; }
.user { display: flex; flex-direction: column; align-items: flex-end; margin-bottom: 16px; }
.bubble { background: #ECE8DD; border-radius: 12px; padding: 10px 16px; font-weight: 500; max-width: 85%; }
.bubble.pending { color: var(--muted); font-style: italic; font-weight: 400; }
.heard { font: var(--caption); color: var(--muted); margin-top: 6px; max-width: 85%; text-align: right; }
.heard b { font-weight: 600; }

.assistant { display: grid; grid-template-columns: 32px 1fr; gap: 12px; }
.avatar { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.avatar svg { width: 18px; height: 18px; }
.items { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.note { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.note svg { width: 18px; height: 18px; flex: none; }
.note.bolt { color: var(--accent); font-weight: 500; }
.reply.error { color: var(--bad); }
.timing { font: var(--caption); color: var(--muted); }
.kicker { display: flex; align-items: center; gap: 8px; font: var(--label); color: var(--muted); }
.kicker svg { width: 16px; height: 16px; }
.voice { font: var(--caption); color: var(--muted); margin-left: auto; }

.step { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; }
.step .ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
.step .ico svg { width: 16px; height: 16px; }
.step.running .ico { border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.step.done .ico { background: var(--ok); }
.step.failed .ico { background: var(--bad); }
.step.undone .ico { background: var(--muted); }
.step .title { font: var(--title); }
.step .detail { color: var(--muted); }
.step.failed .detail { color: var(--bad); }
.step .state { font: var(--label); color: var(--muted); }
.step.done .state { color: var(--ok); }
.step.failed .state { color: var(--bad); }
.step .voice { grid-column: 2 / 4; margin: 0; }
.said-card .kicker { color: var(--accent); }
.typed-card .kicker { color: var(--ok); }
.typed-card.failed .kicker { color: var(--bad); }
.said-card .words, .typed-card .words { font: var(--title); margin-top: 6px; }
.said-card.undone .words, .typed-card.undone .words { text-decoration: line-through; color: var(--muted); }
.typed-card .problem { color: var(--bad); }
.email { grid-column: 2 / 4; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.email div { overflow-wrap: anywhere; } .email b { color: var(--muted); font-weight: 500; display: inline-block; min-width: 76px; }
.undo { grid-column: 1 / 4; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--warn-soft); border-radius: 12px; padding: 8px 12px; margin-top: 12px; }
.undo button { border: 1px solid var(--text); background: var(--panel); border-radius: 12px; padding: 0 16px; font-weight: 600; min-height: var(--target); display: inline-flex; align-items: center; gap: 8px; }
.undo .bar { flex: 1; min-width: 80px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.undo .bar i { display: block; height: 100%; background: var(--warn); transform-origin: left; }

.resolved { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); }
.resolved .q { color: var(--text); }
.resolved .a { font: var(--label); padding: 4px 10px; border-radius: 999px; }
.resolved.allowed .a, .resolved.picked .a { background: var(--ok-soft); color: var(--ok); }
.resolved.denied .a { background: var(--bad-soft); color: var(--bad); }
.resolved.none .a { background: var(--panel-2); color: var(--muted); }
.resolved .by { font: var(--caption); }

/* ---- question cards (the only card with a shadow) ---- */
.perm { box-shadow: 0 6px 20px rgba(31,30,27,.10); animation: rise .2s ease-out; }
.perm-head { display: flex; align-items: center; gap: 8px; font: var(--label); color: var(--muted); }
.perm.risky .perm-head { color: var(--bad); }
.perm-head svg { width: 18px; height: 18px; }
.perm-title { font: var(--title); margin: 8px 0 0; }
.perm-body { font: var(--display); margin: 6px 0 16px; overflow-wrap: anywhere; }
.perm.guess .perm-body { font-style: italic; }
.perm .tagline { display: inline-block; font: var(--label); color: var(--warn); background: var(--warn-soft); padding: 4px 10px; border-radius: 999px; margin-top: 8px; }
.perm .email { margin: 0 0 16px; }
.buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 72px; padding: 12px 18px; border-radius: 12px; border: 1px solid var(--text); background: var(--panel); font: var(--title); text-align: left; position: relative; overflow: hidden; }
.btn.allow { background: var(--text); color: #fff; }
.perm.risky .btn.allow { background: var(--bad); border-color: var(--bad); }
.btn .how { display: flex; align-items: center; gap: 6px; flex: none; }
.key { font: var(--label); padding: 2px 7px; border-radius: 6px; border: 1px solid currentColor; }
.gest { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
.gest .gi { display: inline-flex; width: 24px; height: 24px; }
.gest .gi svg { width: 24px; height: 24px; }
.gest small { font: var(--caption); margin-top: 3px; }
.opt .hint { display: inline-flex; align-items: center; gap: 8px; font: var(--label); color: var(--muted); }
.opt .hint svg { width: 20px; height: 20px; }
.btn.allow .key, .btn.allow .gest { color: #fff; }
.btn .fill { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--accent); width: calc(var(--p, 0) * 100%); transition: width .1s linear; }
.btn.allow .fill { background: #F1B9A5; }
.btn.holding { outline: 3px solid var(--accent); outline-offset: 2px; }
.grid4, .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt { min-height: 96px; align-items: flex-start; flex-direction: column; justify-content: space-between; }
.opt .num { font: var(--label); font-weight: 700; background: var(--text); color: #fff; border-radius: 6px; padding: 2px 9px; }
.opt .row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.opt .txt { overflow-wrap: anywhere; }
.opt.else { background: var(--panel-2); font-style: italic; }
.none-row { display: flex; justify-content: center; margin-top: 12px; }
.none-btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 12px; padding: 0 18px; font-weight: 500; min-height: var(--target); display: flex; gap: 10px; align-items: center; }
.values { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.values button { border: 1px solid var(--text); background: var(--panel); border-radius: 12px; padding: 0 16px; font-weight: 600; min-height: var(--target); }
.detail-row { display: flex; gap: 10px; }
.detail-row input { flex: 1; min-height: var(--target); border: 1px solid var(--line-strong); border-radius: 12px; padding: 0 14px; background: #fff; }
.detail-row button { min-height: var(--target); border-radius: 12px; border: 1px solid var(--text); background: var(--text); color: #fff; font-weight: 600; padding: 0 20px; }
.answer-hint { margin-top: 12px; font: var(--label); color: var(--muted); }
.answer-hint span { display: inline-flex; align-items: center; gap: 6px; }
.answer-hint svg { width: 16px; height: 16px; }
.closes { height: 4px; border-radius: 2px; background: var(--line); margin-top: 14px; overflow: hidden; }
.closes i { display: block; height: 100%; background: var(--line-strong); }

/* ---- composer: one rounded box ---- */
.composer-wrap { padding: 12px 24px 18px; position: relative; }
.composer { max-width: 780px; margin: 0 auto; padding: 12px 12px 12px 18px; border-radius: 16px; }
.composer:focus-within { border-color: var(--line-strong); }
.composer input { width: 100%; border: 0; background: transparent; min-height: var(--target); padding: 0; }
.composer input:focus { outline: none; }
.composer input::placeholder { color: var(--muted); opacity: 1; }
.composer-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.composer-row .grow { flex: 1; }
.mic-why { margin-top: 6px; }
.mic-why[hidden] { display: none; }
.cbtn { display: inline-flex; align-items: center; gap: 8px; min-height: var(--target); padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font: var(--label); font-weight: 600; }
.cbtn svg { width: 18px; height: 18px; flex: none; }
.cbtn.mic { position: relative; color: #fff; background: var(--accent); border-color: var(--accent); }
.cbtn.mic[disabled] { background: var(--panel-2); color: var(--muted); border-color: var(--line); cursor: not-allowed; }
.cbtn.mic[disabled] .lvl { display: none; }
.cbtn.mic.listening { animation: pulse 1.2s ease-in-out infinite; }
.cbtn.mic .lvl { position: absolute; left: 14px; right: 14px; bottom: 6px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35); overflow: hidden; }
.cbtn.mic .lvl i { display: block; height: 100%; background: #fff; width: 0; }
.cbtn.pill[aria-pressed="true"] { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.cbtn.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); }
.cbtn.pill[aria-pressed="true"] .dot { background: var(--ok); }
.cbtn.send { background: var(--text); color: #fff; border-color: var(--text); }
.clips { position: absolute; bottom: calc(100% + 4px); right: max(24px, calc((100% - 780px) / 2)); width: 460px; max-height: 60vh; overflow-y: auto; padding: 12px; z-index: 20; box-shadow: 0 6px 20px rgba(31,30,27,.10); }
.clips h4 { margin: 6px 8px 8px; font: var(--label); color: var(--muted); }
.clips button { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 8px 10px; min-height: var(--target); }
.clips button:focus-visible, .clips button:hover { background: var(--panel-2); }
.clips .play { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.clips .play svg { width: 14px; height: 14px; }
.clips .secs { font: var(--caption); color: var(--muted); }
.clips .clip-label { display: block; font: var(--label); color: var(--muted); }
.clips .step-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--text); color: #fff; font: var(--caption); font-weight: 700; margin-right: 4px; }
.clips .caption { margin: 8px; }

/* ---- right column ---- */
.panel { border-left: 1px solid var(--line); overflow-y: auto; padding: 20px 18px 24px; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { font: var(--label); font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.panel h2 svg { width: 18px; height: 18px; }
.progress { list-style: none; margin: 0; padding: 0; }
.progress li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 6px 0; align-items: start; }
.progress .pi { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; margin-top: 1px; }
.progress .pi svg { width: 13px; height: 13px; }
.progress li.done .pi { background: var(--ok); border-color: var(--ok); }
.progress li.failed .pi { background: var(--bad); border-color: var(--bad); }
.progress li.running .pi { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
.progress li.open .pi { border-color: var(--accent); background: var(--accent-soft); }
.progress .muted { color: var(--muted); }
.counts { display: flex; gap: 10px; margin-bottom: 12px; }
.counts div { flex: 1; background: var(--panel-2); border-radius: 10px; padding: 8px 12px; }
.counts b { display: block; font: 600 22px/1.3 var(--serif); }
.counts span { display: block; font: var(--label); color: var(--muted); }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { padding: 10px 0; border-top: 1px solid var(--line); }
.feed li:first-child { border-top: 0; }
.feed .kind { display: inline-flex; align-items: center; gap: 5px; font: var(--label); font-weight: 600; padding: 2px 8px; border-radius: 6px; margin-bottom: 4px; }
.feed .kind svg { width: 13px; height: 13px; }
.feed .k-learned { background: var(--ok-soft); color: var(--ok); }
.feed .k-fast { background: var(--accent-soft); color: var(--accent); }
.feed .k-undo { background: var(--bad-soft); color: var(--bad); }
.feed .k-other { background: var(--panel-2); color: var(--muted); }
.feed .said { color: var(--muted); font-style: italic; }
.feed .arrow { color: var(--muted); }
.feed .meant { font-weight: 600; }
.feed .ms { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.feed-empty { color: var(--muted); }

/* ---- camera preview ---- */
.cam { padding: 0; overflow: hidden; flex: none; animation: rise .2s ease-out; }
.cam[hidden] { display: none; }
.cam img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #2B2A27; }
.cam .off { min-height: 160px; display: grid; place-items: center; text-align: center; color: var(--text); padding: 20px; }
.cam .pic { position: relative; }
.cam .off svg { width: 30px; height: 30px; margin-bottom: 6px; }
.cam .cap { font: var(--label); padding: 10px 14px; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); }
.cam .rec { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
.cam .ring { position: absolute; top: 10px; left: 10px; width: 54px; height: 54px; }
.cam .ring circle { fill: none; stroke-width: 6; }

.toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 12px 18px; border-radius: 12px; max-width: 640px; z-index: 30; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--accent-soft); } }
html.still *, html.still *::before, html.still *::after { animation: none !important; transition: none !important; }   /* screenshots */
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@media (max-width: 1180px) { .app { grid-template-columns: 220px minmax(0, 1fr) 290px; } }
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 100vh; }
  .side, .panel { display: none; }
  .scroll { overflow: visible; }
  .buttons, .grid4 { grid-template-columns: 1fr; }
  .clips { width: auto; left: 16px; right: 16px; }
  .convo { padding: 20px 16px 32px; }
  .composer-row { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Tasks">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 12h2M8 8v8M12 5v14M16 8v8M20 12h0"/></svg></span>Cowork</div>
    <button class="new-task" id="newTask"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New task</button>
    <h3>Recent</h3>
    <ul class="recent" id="recent"></ul>
    <div class="side-foot"><div class="note-local">Runs entirely on this Mac. Your voice never leaves it.</div><div class="caption" id="credit"></div></div>
  </aside>

  <main class="main">
    <div class="strip" id="strip" aria-label="Status"></div>
    <div class="scroll" id="scroll">
      <div class="convo" id="convo" aria-live="polite"></div>
    </div>
    <div class="composer-wrap">
      <div class="clips card" id="clips" hidden></div>
      <form class="composer card" id="typeForm" autocomplete="off">
        <label class="sr" for="typed">Type what was said</label>
        <input id="typed" placeholder="Type what was said, or press the mic…">
        <div class="composer-row">
          <button type="button" class="cbtn mic" id="speak" title="Listen now">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            <span id="speakLabel">Speak</span><span class="lvl"><i id="lvl"></i></span>
          </button>
          <button type="button" class="cbtn pill" id="dictBtn" aria-pressed="false"><span class="dot"></span><span id="dictLabel">Dictation: off</span></button>
          <span class="grow"></span>
          <button type="button" class="cbtn" id="clipBtn" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg>Test clips
          </button>
          <button type="submit" class="cbtn send">Send</button>
        </div>
        <div class="caption mic-why" id="micWhy" role="status" hidden></div>
      </form>
    </div>
  </main>

  <aside class="panel" aria-label="Camera, progress and learning">
    <section class="cam card" id="cam" aria-label="Camera" hidden></section>
    <section class="card">
      <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Progress</h2>
      <ul class="progress" id="progress"></ul>
    </section>
    <section class="card">
      <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12h2M8 8v8M12 5v14M16 8v8M20 11v2"/></svg>What I've learned about your voice</h2>
      <div class="counts" id="counts"></div>
      <ul class="feed" id="feed"></ul>
    </section>
  </aside>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
"use strict";
if (location.search.includes("still")) document.documentElement.classList.add("still");
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }).then((r) => r.json()).catch(() => ({}));

const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  learn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M7 10.5V15c0 1.5 2.5 3 5 3s5-1.5 5-3v-4.5"/></svg>',
  ear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9a6 6 0 1 1 12 0c0 4-4 5-4 9a3 3 0 0 1-6 0"/></svg>',
  speaker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/></svg>',
  hand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4a1.5 1.5 0 0 1 3 0v8M14 11V5.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7 6 6 0 0 1-5-3l-2.5-4.5a1.5 1.5 0 0 1 2.5-1.5L8 15"/></svg>',
  keys: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4v16l13-8z"/></svg>',
  mark: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 12h2M8 8v8M12 5v14M16 8v8M20 12h0"/></svg>',
};
// The hand signals each answer accepts (same meaning as choose/meaning.py), as line icons.
const SVG_HAND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4a1.5 1.5 0 0 1 3 0v8M14 11V5.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7 6 6 0 0 1-5-3l-2.5-4.5a1.5 1.5 0 0 1 2.5-1.5L8 15"/></svg>';
const SVG_THUMB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v10H4a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h3zM7 11l4-8a2.5 2.5 0 0 1 3 2.5V9h5a2 2 0 0 1 2 2.3l-1.2 7.4A2.5 2.5 0 0 1 17.3 21H7"/></svg>';
function gest(kind, side) {   // kind: "hand", "up", "down"; side: "left", "right" or "" (either hand)
  const icon = kind === "hand" ? SVG_HAND : SVG_THUMB;
  const turn = (side === "left" ? "scaleX(-1)" : "") + (kind === "down" ? " scaleY(-1)" : "");
  const name = { hand: "hand up", up: "thumb up", down: "thumb down" }[kind];
  const who = side === "left" ? "Left" : side === "right" ? "Right" : "Thumb";
  return `<span class="gest" title="${side ? who : "Either"} ${name}"><span class="gi" style="transform:${turn || "none"}">${icon}</span><small>${who}</small></span>`;
}
const GRID_HINT = ["Left thumb up", "Right thumb up", "Left thumb down", "Right thumb down"];
const GRID_GEST = [["up", "left"], ["up", "right"], ["down", "left"], ["down", "right"]];
const YES_SIGNALS = ["RIGHT", "RIGHT_UP", "LEFT_UP"], NO_SIGNALS = ["LEFT", "RIGHT_DOWN", "LEFT_DOWN"];
const GRID = ["LEFT_UP", "RIGHT_UP", "LEFT_DOWN", "RIGHT_DOWN"];
const NAMES = { "Speech in": "WhisperKit", "Brain": "Bonsai 2 4B", "Voice": "TTSKit" };

let camUrl = null;
let S = null, lastQid = null, lastTurnCount = -1, toastTimer = null;

let detailsOpen = false;
function stripHtml(s) {
  const chips = [];
  const off = s.metrics && s.metrics.offline;
  if (!off) chips.push('<span class="chip"><span class="dot"></span>Checking network…</span>');
  else if (off.offline) chips.push('<span class="chip ok"><span class="dot"></span>Offline</span>');
  else chips.push('<span class="chip warn"><span class="dot"></span>Wi-Fi on · Cowork sends nothing</span>');
  chips.push(`<button class="chip" id="localBtn" aria-expanded="${detailsOpen}" aria-controls="localParts"><span class="dot" style="background:var(--ok)"></span>Running locally<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>`);
  if (detailsOpen) {
    const parts = [];
    for (const [part, name] of Object.entries(NAMES)) {
      const fake = (s.backends || {})[part] === "fake";
      parts.push(`<span class="chip${fake ? "" : " ok"}"><span class="dot"></span>${name}${fake ? ' <span class="tag">test</span>' : ""}</span>`);
    }
    const c = s.camera || {};
    const camText = !c.connected ? "Camera off" : c.problem ? "Camera not found" : c.on ? "Camera watching" : "Camera ready";
    parts.push(`<span class="chip${c.connected && !c.problem ? " ok" : c.problem ? " warn" : ""}"><span class="dot"></span>${camText}</span>`);
    if (s.mic && s.mic.on) parts.push('<span class="chip ok"><span class="dot"></span>Microphone</span>');
    chips.push(`<span id="localParts" style="display:contents">${parts.join("")}</span>`);
  }
  return chips.join("");
}

function turnsOf(s) {
  const turns = [...(s.history || [])];
  if (s.turn && !s.turn.finished && !turns.some((t) => t.id === s.turn.id)) turns.push(s.turn);
  return turns;
}
function lastTurn(s) { const t = turnsOf(s); return t[t.length - 1]; }

function voiceTag(item) {
  return item.voice ? `<span class="voice" title="Which voice spoke this">voice: ${esc(item.voice)}</span>` : "";
}
function stepHtml(item, open) {
  const icon = { done: ICON.check, failed: ICON.x, undone: ICON.undo, running: "" }[item.status] || "";
  const state = { done: "Done", failed: "Didn't work", undone: "Undone", running: "Working…" }[item.status] || "";
  const detail = item.status === "failed" ? (item.problem || item.detail) : item.detail;
  let html = `<div class="card step ${item.status}"><span class="ico">${icon}</span><div><div class="title">${esc(item.title)}</div>${detail ? `<div class="detail">${esc(detail)}</div>` : ""}</div><span class="state">${state}</span>${voiceTag(item)}`;
  if (item.email) html += emailHtml(item.email);
  if (item.undo_until && open) html += undoHtml(item.undo_until);
  return html + "</div>";
}
function emailHtml(e) {
  return `<div class="email"><div><b>To</b> ${esc(e.to)}</div><div><b>Subject</b> ${esc(e.subject)}</div><div><b>Message</b> ${esc(e.body)}</div></div>`;
}
function undoHtml(until) {
  return `<div class="undo"><span>Not what you wanted?</span><button data-undo="1">Undo <span class="key">Esc</span></button>${gest("hand", "left")}<span>or say “no”</span><span class="bar"><i data-until="${until}"></i></span></div>`;
}
function spokenHtml(item, open) {
  const label = item.status === "running" ? "Saying out loud…" : item.status === "undone" ? "Stopped" : "Said out loud";
  return `<div class="card said-card ${item.status}"><div class="kicker">${ICON.speaker}${label}${voiceTag(item)}</div><div class="words">${esc(item.text)}</div>${item.undo_until && open ? `${undoHtml(item.undo_until)}` : ""}</div>`;
}
function typedHtml(item, open) {
  const label = item.status === "failed" ? `Couldn't type into ${item.app}` : item.status === "undone" ? `Removed from ${item.app}` : `Typed into ${item.app}`;
  return `<div class="card typed-card ${item.status}"><div class="kicker">${ICON.keys}${esc(label)}${voiceTag(item)}</div><div class="words">${esc(item.text)}</div>${item.problem && item.status === "failed" ? `<div class="problem">${esc(item.problem)}</div>` : ""}${item.undo_until && open ? `${undoHtml(item.undo_until)}` : ""}</div>`;
}
function resolvedHtml(item) {
  const c = item.card || {};
  const q = c.body ? `${esc(c.title)} <b>${esc(c.body)}</b>` : esc(c.title);
  return `<div class="resolved ${item.status}"><span class="q">${q}</span><span class="a">${esc(item.answer || "")}</span>${item.by ? `<span class="by">${esc(item.by)}</span>` : ""}</div>`;
}

function yesText(c) {
  // The Yes button says what will happen.
  if (c.allow && c.allow !== "Yes" && c.allow !== "Allow" && !c.guess) return c.allow;
  const dict = (S && S.dictation) || {};
  const app = (dict.app || "").replace(/^Microsoft /, "") || "the app";
  if (c.say_aloud) return dict.on ? `Yes, type it into ${app}` : "Yes, say it";
  if (c.body) return `Yes, ${c.body.charAt(0).toLowerCase()}${c.body.slice(1)}`;
  return c.allow || "Yes";
}
function permHtml(q) {
  const c = q.card || {};
  const hold = S.hold && S.hold.signal ? S.hold : null;
  const holdFor = (signals) => (hold && signals.includes(hold.signal) ? ` holding" style="--p:${hold.progress}` : "");
  let head, body = "";
  if (c.risky) head = `${ICON.warn}Needs your permission`;
  else if (c.guess) head = `${ICON.learn}A guess`;
  else head = `${ICON.shield}Checking with you`;
  let html = `<div class="card perm${c.risky ? " risky" : ""}${c.guess ? " guess" : ""}" role="dialog" aria-label="${esc(c.title)}"><div class="perm-head">${head}</div>`;
  html += `<div class="perm-title">${esc(c.title)}</div>`;
  if (c.guess) html += '<span class="tagline">Not from your list — only ever spoken, never done on the Mac</span>';
  if (c.body) html += `<div class="perm-body">${c.say_aloud ? "“" + esc(c.body) + "”" : esc(c.body)}</div>`;
  if (c.email) html += emailHtml(c.email);
  if (q.kind === "yes_no") {
    html += `<div class="buttons">
      <button class="btn deny${holdFor(NO_SIGNALS)}" data-answer="no"><span>${esc(c.deny)}</span><span class="how"><span class="key">Esc</span>${gest("hand", "left")}${gest("down", "")}</span><span class="fill"></span></button>
      <button class="btn allow${holdFor(YES_SIGNALS)}" data-answer="yes"><span>${esc(yesText(c))}</span><span class="how"><span class="key">Enter</span>${gest("hand", "right")}${gest("up", "")}</span><span class="fill"></span></button>
    </div>`;
    html += `<div class="answer-hint">Say yes or no, show your thumb, or press Enter/Esc.</div>`;
  } else if (q.kind === "choice") {
    const opts = c.options || [];
    html += `<div class="${opts.length > 2 ? "grid4" : "grid2"}">` + opts.map((o, i) =>
      `<button class="btn opt${o.kind === "else" ? " else" : ""}${holdFor([GRID[i]])}" data-pick="${i}"><span class="row"><span class="num">${i + 1}</span><span class="hint">${gest(GRID_GEST[i][0], GRID_GEST[i][1]).replace(/<small>.*?<\/small>/, "")}${GRID_HINT[i]}</span></span><span class="txt">${esc(o.text)}</span><span class="fill"></span></button>`).join("") + "</div>";
    html += `<div class="none-row"><button class="none-btn" data-answer="none">None of these <span class="key">Esc</span></button></div>`;
    html += `<div class="answer-hint">Say the number, show your thumb, or press 1-4.</div>`;
  } else if (q.kind === "detail") {
    html += `<div class="values">${(c.options || []).map((o) => `<button data-text="${esc(o.text)}">${esc(o.text)}</button>`).join("")}</div>
      <form class="detail-row" data-detail="1"><input id="detailInput" aria-label="${esc(c.title)}" placeholder="Type it"><button>OK</button></form>`;
  }
  if (q.closes_at && q.kind !== "detail") html += `<div class="closes"><i data-until="${q.closes_at}" data-total="${q.seconds || 60}"></i></div>`;
  return html + "</div>";
}

function turnHtml(t, isLast) {
  const pending = !t.request;
  const words = pending ? (t.finished ? `“${t.heard}”` : "Understanding…") : t.request;
  const source = t.source === "test clip" ? "TORGO test clip" : t.source === "microphone" ? "your voice" : t.source === "keyboard" ? "typed" : t.source;
  let html = `<div class="turn"><div class="user"><div class="bubble${pending ? " pending" : ""}">${esc(words)}</div><div class="heard">heard: <b>“${esc(t.heard)}”</b> · ${esc(source)}</div></div>`;
  html += `<div class="assistant"><div class="avatar" aria-hidden="true">${ICON.mark}</div><div class="items">`;
  const open = isLast && !t.finished;
  for (const item of t.items || []) {
    if (item.type === "note") {
      const text = item.icon === "bolt" ? "Recognized instantly from what I've learned" : item.text;
      html += `<div class="note ${item.icon}">${ICON[item.icon] || ""}<span>${esc(text)}</span></div>`;
    }
    else if (item.type === "step") html += stepHtml(item, open);
    else if (item.type === "spoken") html += spokenHtml(item, open);
    else if (item.type === "typed") html += typedHtml(item, open);
    else if (item.type === "reply") html += `<div class="reply${item.error ? " error" : ""}">${item.read_aloud ? `<div class="kicker">${ICON.speaker}Read aloud${voiceTag(item)}</div>` : ""}${esc(item.text)}</div>`;
    else if (item.type === "permission") {
      if (item.status === "open" && open && S.question && S.question.id === item.qid) html += permHtml(S.question);
      else if (item.status !== "open") html += resolvedHtml(item);
    }
  }
  const secs = t.response_ms != null ? (t.response_ms + (t.asr_ms || 0)) / 1000 : 0;
  if (secs >= 0.05 && (t.items || []).length) html += `<div class="timing">understood in ${secs.toFixed(1)} s</div>`;
  if (open && !(t.items || []).length) html += `<div class="note">${ICON.ear}<span>${S.status === "listening again" ? "Listening to the recording again…" : "Working out what you meant…"}</span></div>`;
  return html + "</div></div></div>";
}

function emptyHtml(s) {
  const clips = (s.clips || []).length ? "or choose a test clip" : "";
  return `<div class="empty"><h1>What can I do for you?</h1><p>Say it in your own way. I'll check with you whenever I'm not sure, and you can answer by voice, hand, or keyboard.</p>
    <div class="ways"><span class="chip">Press the mic ${clips}</span><span class="chip">“Open Notes”</span><span class="chip">“Type see you at noon”</span><span class="chip">“Email Anna”</span></div></div>`;
}

function progressHtml(s) {
  const t = lastTurn(s);
  if (!t) return '<li><span class="pi"></span><span class="muted">Nothing yet. Steps appear here as I work.</span></li>';
  const rows = [];
  const thought = t.request || t.finished || (t.items || []).length;
  rows.push({ cls: thought ? "done" : "running", text: t.request ? `Understood: ${t.request}` : thought ? `Heard “${t.heard}”` : "Understanding what you said" });
  for (const item of t.items || []) {
    if (item.type === "permission") rows.push({ cls: item.status === "open" ? "open" : item.status === "denied" || item.status === "none" ? "failed" : "done", text: (item.card || {}).title + (item.answer ? ` — ${item.answer}` : "") });
    else if (item.type === "step") rows.push({ cls: item.status === "undone" ? "failed" : item.status, text: item.title });
    else if (item.type === "spoken") rows.push({ cls: item.status === "undone" ? "failed" : item.status, text: "Say it out loud" });
    else if (item.type === "typed") rows.push({ cls: item.status === "undone" ? "failed" : item.status, text: `Type it into ${item.app}` });
  }
  return rows.map((r) => `<li class="${r.cls}"><span class="pi">${r.cls === "done" ? ICON.check : r.cls === "failed" ? ICON.x : ""}</span><span>${esc(r.text)}</span></li>`).join("");
}

function feedHtml(s) {
  const items = (s.feed || []).filter((f) => ["learned", "fast_path", "undone", "forgot", "cancelled", "new_phrase"].includes(f.kind)).slice(0, 4);
  if (!items.length) return '<li class="feed-empty">Each time you confirm something, I learn how you say it. Next time it is instant.</li>';
  const q = (t) => `‘${esc(String(t || "").replace(/[.!?]+$/, ""))}’`;
  return items.map((f) => {
    const meant = f.request || f.meaning || f.phrase || "";
    if (f.kind === "learned") return `<li><span class="kind k-learned">${ICON.learn}Learned</span><div>${q(f.heard)} means ${q(meant)}</div></li>`;
    if (f.kind === "fast_path") return `<li><span class="kind k-fast">${ICON.bolt}Recognized instantly</span><div>${q(meant)}</div></li>`;
    if (f.kind === "new_phrase") return `<li><span class="kind k-learned">${ICON.learn}New phrase</span><div>${q(f.phrase)}</div></li>`;
    const undo = ICON.undo.replace('stroke="#fff"', 'stroke="currentColor"');
    if (f.kind === "cancelled") return `<li><span class="kind k-undo">${undo}Cancelled</span><div>${q(meant)}</div></li>`;
    return `<li><span class="kind k-undo">${undo}Forgot</span><div>${f.heard ? `${q(f.heard)} doesn't mean ${q(meant)}` : q(meant)}</div></li>`;
  }).join("");
}

function camHtml(s) {
  const c = s.camera || {};
  const hold = s.hold && s.hold.signal ? s.hold : null;
  const ring = '<span id="camRing"></span>';
  const picture = c.connected && c.problem
    ? `<div class="off"><div>${ICON.cam}<br>${esc(c.problem)}</div></div>`
    : c.connected
    ? `<img id="camImg" alt="">${ring}`
    : `<div class="off"><div>${ICON.cam}<br>Camera not connected<br><small>start with --camera to answer by hand</small></div></div>`;
  const cap = !c.connected ? "Hand answers need the camera"
    : c.problem ? "Answer by voice or keyboard instead" : "Watching for your answer — nothing is recorded";
  return `<div class="pic">${picture}</div><div class="cap"><span class="rec"${c.problem || !c.connected ? ' style="background:var(--warn)"' : ""}></span>${cap}</div>`;
}

let camKey = "";
function render(s) {
  S = s;
  $("strip").innerHTML = stripHtml(s);
  const turns = turnsOf(s);
  $("convo").innerHTML = turns.length ? turns.map((t, i) => turnHtml(t, i === turns.length - 1)).join("") : emptyHtml(s);
  $("recent").innerHTML = turns.slice().reverse().map((t, i) => `<li class="${i === 0 ? "now" : ""}">${t.finished && t.request ? '<span class="tick"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>' : ""}${esc(t.request || "“" + t.heard + "”")}</li>`).join("") || '<li style="color:var(--muted)">No tasks yet</li>';
  $("progress").innerHTML = progressHtml(s);
  const counts = s.counts || {};
  $("counts").innerHTML = `<div><b>${counts.examples ?? 0}</b><span>ways you say things</span></div><div><b>${counts.phrases ?? 0}</b><span>your phrases</span></div>`;
  $("feed").innerHTML = feedHtml(s);
  $("credit").textContent = s.credit || "";
  const dict = s.dictation || {};
  $("dictBtn").setAttribute("aria-pressed", dict.on ? "true" : "false");
  const where = (dict.app || "").replace(/^Microsoft /, "") || "app";
  $("dictLabel").textContent = dict.on ? `Dictation: ${where}` : "Dictation: off";
  $("dictBtn").title = dict.on ? `Confirmed sentences are typed into ${dict.app || "the app you were using"}, then read back` : "Off: sentences are said out loud";
  const mic = s.mic || {};
  $("speak").disabled = !mic.on;
  const why = mic.on ? "" : mic.problem
    ? "Microphone couldn't open. Allow Terminal in System Settings › Privacy & Security › Microphone."
    : (mic.off_reason || "Microphone is off.");
  $("speak").title = mic.on ? "Listen now" : (mic.problem || why);
  $("micWhy").hidden = !why;
  $("micWhy").textContent = why ? `Speak is off: ${why}` : "";
  $("speak").classList.toggle("listening", !!mic.listening);
  $("speakLabel").textContent = s.playing ? "Playing clip…" : mic.listening ? "Listening…" : s.status === "hearing" ? "Hearing…" : "Speak";
  // Camera preview: slides in while a card can be answered by hand.
  const q = s.question;
  const showCam = !!(q && (q.kind === "yes_no" || q.kind === "choice"));
  $("cam").hidden = !showCam;
  const key = JSON.stringify(s.camera);
  if (key !== camKey) { camKey = key; $("cam").innerHTML = camHtml(s); if (camUrl && $("camImg")) $("camImg").src = camUrl; }
  if ($("camRing")) {   // only the hold-to-confirm ring changes while a hand is held up
    const hold = s.hold && s.hold.signal ? s.hold : null;
    $("camRing").innerHTML = hold ? `<svg class="ring" viewBox="0 0 54 54"><circle cx="27" cy="27" r="22" stroke="rgba(255,255,255,.35)"/><circle cx="27" cy="27" r="22" stroke="#F1B9A5" stroke-dasharray="${(138 * hold.progress).toFixed(1)} 138" transform="rotate(-90 27 27)" stroke-linecap="round"/></svg>` : "";
  }
  // New card or new turn: bring it into view.
  const qid = q ? q.id : null;
  if (qid !== lastQid || turns.length !== lastTurnCount) {
    lastQid = qid; lastTurnCount = turns.length;
    const sc = $("scroll"); sc.scrollTop = sc.scrollHeight;
    const card = document.querySelector(".perm");
    if (card) {   // the whole card, never clipped under the header
      const fits = card.offsetHeight + 40 <= sc.clientHeight;
      card.scrollIntoView({ block: fits ? "end" : "start" });
    }
    if (q && q.kind === "detail") setTimeout(() => $("detailInput") && $("detailInput").focus(), 30);
  }
  const camProblem = s.camera && s.camera.problem;
  if (s.notice && Date.now() / 1000 - s.notice.time < 6 && s.notice.text !== camProblem) showToast(s.notice.text);
  if (camProblem && $("toast").textContent === camProblem) $("toast").hidden = true;   // shown in the camera card only
}

function showToast(text) {
  const t = $("toast");
  if (t.textContent === text && !t.hidden) return;
  t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 5000);
}

// Countdown bars (correction window, question timeout).
setInterval(() => {
  const now = Date.now() / 1000;
  document.querySelectorAll("[data-until]").forEach((el) => {
    const until = +el.dataset.until, total = +(el.dataset.total || 3);
    el.style.transform = `scaleX(${Math.max(0, Math.min(1, (until - now) / total))})`;
  });
}, 100);

// Camera frames, only while the preview is showing.
let camBusy = false;
setInterval(async () => {
  if (camBusy || !S || !S.camera || !S.camera.connected || $("cam").hidden) return;
  const img = $("camImg");
  if (!img) return;
  camBusy = true;
  try {
    const r = await fetch("/api/camera.jpg?t=" + Date.now());
    if (r.status === 200) {
      const url = URL.createObjectURL(await r.blob());
      img.src = url; if (camUrl) URL.revokeObjectURL(camUrl); camUrl = url;
    }
  } catch (e) {}
  camBusy = false;
}, 100);

// ---- inputs ---------------------------------------------------------------
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) { if (!e.target.closest("#clips") && !e.target.closest("#clipBtn")) hideClips(); return; }
  if (b.dataset.answer) post("/api/answer", { kind: b.dataset.answer });
  else if (b.dataset.pick !== undefined) post("/api/answer", { kind: "pick", value: +b.dataset.pick });
  else if (b.dataset.text !== undefined) post("/api/answer", { kind: "text", value: b.dataset.text });
  else if (b.dataset.undo) post("/api/answer", { kind: "no" });
  else if (b.dataset.clip) { hideClips(); post("/api/clip", { id: b.dataset.clip }).then((r) => r && r.problem && showToast(r.problem)); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.dataset.detail) { const v = $("detailInput").value.trim(); if (v) post("/api/answer", { kind: "text", value: v }); return; }
  const v = $("typed").value.trim();
  if (!v) return;
  $("typed").value = "";
  post("/api/say", { text: v });
});
$("speak").addEventListener("click", () => post("/api/listen"));
$("newTask").addEventListener("click", () => post("/api/new"));
document.addEventListener("click", (e) => { if (e.target.closest("#localBtn")) { detailsOpen = !detailsOpen; if (S) $("strip").innerHTML = stripHtml(S); } });
$("dictBtn").addEventListener("click", () => post("/api/dictation", { on: !(S && S.dictation && S.dictation.on) }));
$("clipBtn").addEventListener("click", () => ($("clips").hidden ? showClips() : hideClips()));
function showClips() {
  const clips = (S && S.clips) || [];
  const row = (c, n) => `<button data-clip="${esc(c.id)}"><span class="play">${ICON.play}</span><span>${n ? `<b class="step-n">${n}</b> ` : ""}“${esc(c.said)}”${c.label ? `<span class="clip-label">${esc(c.label)}</span>` : ""}</span><span class="secs">${c.seconds ? c.seconds.toFixed(1) + " s" : ""}</span></button>`;
  const demo = clips.filter((c) => c.demo), more = clips.filter((c) => !c.demo);
  $("clips").innerHTML = (clips.length ? `<h4>Dictation demo — play in this order</h4>` + demo.map((c, i) => row(c, i + 1)).join("") +
    (more.length ? `<h4>More recordings</h4>` + more.map((c) => row(c, 0)).join("") : "")
    : '<p class="feed-empty" style="padding:0 8px">No clips found on this Mac.</p>') + `<div class="caption">${esc((S && S.credit) || "")}</div>`;
  $("clips").hidden = false; $("clipBtn").setAttribute("aria-expanded", "true");
  const first = $("clips").querySelector("button"); if (first) first.focus();
}
function hideClips() { $("clips").hidden = true; $("clipBtn").setAttribute("aria-expanded", "false"); }

document.addEventListener("keydown", (e) => {
  if (!S) return;
  const q = S.question, typing = document.activeElement && document.activeElement.tagName === "INPUT";
  if (e.key === "Escape" && !$("clips").hidden) { hideClips(); return; }
  if (!q) {
    if (e.key === " " && !typing && document.activeElement === document.body) { e.preventDefault(); post("/api/listen"); }
    return;
  }
  if (q.kind === "window") { if (e.key === "Escape") { e.preventDefault(); post("/api/answer", { kind: "no" }); } return; }
  if (q.kind === "detail") return;   // the text box handles Enter
  if (typing && $("typed").value) return;
  if (q.kind === "yes_no") {
    if (e.key === "Enter") { e.preventDefault(); post("/api/answer", { kind: "yes" }); }
    else if (e.key === "Escape") { e.preventDefault(); post("/api/answer", { kind: "no" }); }
  } else if (q.kind === "choice") {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= (q.options || []).length) { e.preventDefault(); post("/api/answer", { kind: "pick", value: n - 1 }); }
    else if (e.key === "Escape") { e.preventDefault(); post("/api/answer", { kind: "none" }); }
  }
});

// ---- live updates -----------------------------------------------------------
function connect() {
  const source = new EventSource("/api/stream");
  source.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "level") {
      const pct = Math.max(0, Math.min(100, (msg.level + 60) * 1.8));
      $("lvl").style.width = pct + "%";
      return;
    }
    if (msg.state) render(msg.state);
  };
  source.onerror = () => { source.close(); setTimeout(connect, 1000); };
}
fetch("/api/state").then((r) => r.json()).then(render).catch(() => {});
connect();
</script>
</body>
</html>
