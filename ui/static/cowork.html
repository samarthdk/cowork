<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cowork</title>
<!-- Fully offline: no web fonts, no outside scripts. Served by ui/server.py on this Mac only. -->
<style>
/* Glass: the window is see-through and macOS blurs the desktop behind it (ui/window.py).
   Every piece of text sits on a panel with a NEUTRAL dark tint rgba(12,12,14,0.67) over the 0.22 base, so the
   wallpaper's own colour shows through. Worst case, a pure white wallpaper: all text colours stay at 4.5:1 or
   more (white 8.8, light gray 6.1, clay 4.6, green 5.5, red 4.5, amber 5.4). The red-orange (--live) is only
   used for icons and dots (3:1 is enough for those: 3.4).
   Type scale: display 40 serif | title 22 semibold | body 17 | label 14 medium | caption 12.
   One card style: 12px radius, 20px padding, 1px light border at 15%. No emoji. */
:root {
  --tint: rgba(12, 12, 14, 0.67);
  --tint-strong: rgba(14, 14, 16, 0.86);
  --base: rgba(10, 10, 12, 0.22);       /* gutters between panels: no text sits here */
  --line: rgba(255, 255, 255, 0.15);
  --line-strong: rgba(255, 255, 255, 0.32);
  --hover: rgba(255, 255, 255, 0.07);
  --text: #FFFFFF;
  --muted: #D6D6DA;
  --accent: #F3AA8F;     /* 4.6:1 for text over the panels (0.67) on a white wallpaper */
  --ok: #8FDDA5;
  --bad: #FFA294;
  --warn: #F2C46B;
  --focus: #8DB6FF;
  --live: #FF7A59;     /* red-orange: listening, and "off" on the dictation dot */
  --white: #FFFFFF;
  --ink: #1A1411;
  --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --display: 500 40px/1.2 var(--serif);
  --title: 600 22px/1.3 var(--sans);
  --body: 400 17px/1.5 var(--sans);
  --label: 500 14px/1.35 var(--sans);
  --caption: 400 12px/1.4 var(--sans);
  --target: 48px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: transparent; }
body { color: var(--text); font: var(--body); -webkit-font-smoothing: antialiased; background: var(--base); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.caption { font: var(--caption); color: var(--muted); }
svg { flex: none; }

/* The one card style */
.card { background: var(--tint); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }

.app { --side-w: 250px; --rail-w: 260px; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) var(--rail-w); gap: 10px; height: 100vh; padding: 14px; }

/* ---- sidebar: grouped, an icon on every item ---- */
.side { display: flex; flex-direction: column; min-height: 0; padding: 12px 12px; gap: 2px; overflow-y: auto; }
.group { font: var(--caption); font-weight: 600; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin: 6px 10px 2px; }
.nav { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px; padding: 0 10px; border: 0; border-radius: 10px;
       background: transparent; text-align: left; color: var(--text); flex: none; }
.nav:hover, .nav[aria-expanded="true"] { background: var(--hover); }
.nav svg { width: 20px; height: 20px; color: var(--muted); }
.nav .count { margin-left: auto; font: var(--caption); color: var(--muted); }
.recent { list-style: none; margin: 0 0 4px; padding: 0 0 0 42px; }
.recent[hidden] { display: none; }
.recent li { padding: 6px 0; font: var(--label); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent li.now { color: var(--text); }
.recent li { padding: 0; }
.recent li.now { padding: 6px 0; }
.recent .task { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 6px 8px; margin-left: -8px;
                font: var(--label); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 36px; }
.recent .task:hover, .recent .task[aria-current="true"] { background: var(--hover); color: var(--text); }
.recent .when { font: var(--caption); margin-left: 6px; }
.viewing { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
.viewing .what { flex: 1; min-width: 200px; }
.viewing .what b { font-weight: 600; }
.viewing button { min-height: var(--target); border-radius: 12px; padding: 0 18px; font-weight: 600; border: 1px solid var(--line-strong); background: transparent; }
.viewing button.go { background: var(--white); color: var(--ink); border-color: var(--white); }
.side .spacer { flex: 1; min-height: 12px; }
.toggle-btn { display: flex; align-items: center; justify-content: center; width: 40px; min-height: 40px; flex: none;
              border: 0; border-radius: 10px; background: transparent; color: var(--muted); }
.toggle-btn:hover { background: var(--hover); }
.toggle-btn svg { width: 20px; height: 20px; transition: transform .18s; }
.side-top { display: flex; align-items: center; gap: 8px; }
.side-top .quick-open { flex: none; width: 40px; min-height: 40px; padding: 0; justify-content: center; border: 0; background: transparent; }
.side-top .quick-open:hover { background: var(--hover); }
.side-top .quick-open svg { width: 18px; height: 18px; }
/* Collapsed sidebar: only the item icons remain, in a narrow strip. Group headings
   become thin dividers and the spacer keeps Settings/Help pinned to the bottom. */
.app.collapsed { --side-w: 60px; }
.app.collapsed .side { padding: 12px 8px; align-items: center; }
.app.collapsed .side-top { flex-direction: column; gap: 4px; }
.app.collapsed .toggle-btn svg { transform: scaleX(-1); }
.app.collapsed .quick-open { width: 40px; min-height: 40px; padding: 0; justify-content: center; }
.app.collapsed .quick-open span, .app.collapsed .quick-open .kbd { display: none; }
.app.collapsed .group { align-self: stretch; font-size: 0; height: 1px; margin: 10px 6px; background: var(--line); }
.app.collapsed .nav { justify-content: center; padding: 0 8px; gap: 0; font-size: 0; }
.app.collapsed .nav .count, .app.collapsed .recent { display: none; }
.app.collapsed .nav svg { width: 22px; height: 22px; }

/* ---- right rail: narrower, collapsible to an icon strip ---- */
.rail-toggle { display: flex; align-items: center; justify-content: center; width: 40px; min-height: 40px; flex: none;
               align-self: flex-end; border: 0; border-radius: 10px; background: transparent; color: var(--muted); }
.rail-toggle:hover { background: var(--hover); }
.rail-toggle svg { width: 20px; height: 20px; transition: transform .18s; }
.app.rail-collapsed { --rail-w: 48px; }
.app.rail-collapsed .rail { padding: 12px 4px; }
.app.rail-collapsed .rail .row { display: none; }
.app.rail-collapsed .rail-toggle svg { transform: scaleX(-1); }

/* ---- main column ---- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 0; overflow: hidden; position: relative; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; min-height: 36px; border-radius: 999px; background: rgba(255,255,255,.06);
        border: 1px solid var(--line); font: var(--label); white-space: nowrap; color: var(--text); }
button.chip { min-height: var(--target); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.chip.ok .dot { background: var(--ok); }
.chip.warn .dot { background: var(--warn); }
.chip .tag { font: var(--caption); font-weight: 600; color: var(--warn); }
.chip .chev { width: 14px; height: 14px; }
.chip[aria-expanded="true"] .chev { transform: rotate(180deg); }
.quick-open { display: inline-flex; align-items: center; gap: 10px; min-height: var(--target); padding: 0 8px 0 14px; border-radius: 10px;
              border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--muted); font: var(--label); }
.quick-open svg { width: 16px; height: 16px; }
.kbd { font: var(--caption); font-weight: 600; color: var(--text); border: 1px solid var(--line-strong); border-radius: 6px; padding: 2px 7px; }

.scroll { flex: 1; overflow-y: auto; min-height: 0; scroll-padding: 20px; }
.convo { max-width: 760px; margin: 0 auto; padding: 26px 26px 36px; }
.empty { text-align: center; padding: 12vh 20px 0; }
.empty h1 { font: var(--display); margin: 0 0 12px; }
.empty p { color: var(--muted); margin: 0 auto; max-width: 520px; }
.empty .ways { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }

.turn { margin-bottom: 30px; }
.user { display: flex; flex-direction: column; align-items: flex-end; margin-bottom: 14px; }
.bubble { background: rgba(255,255,255,.10); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; font-weight: 500; max-width: 85%; }
.bubble.pending { color: var(--muted); font-style: italic; font-weight: 400; }
.heard { font: var(--caption); color: var(--muted); margin-top: 6px; max-width: 85%; text-align: right; }
.heard b { font-weight: 600; color: var(--text); }
.assistant { display: grid; grid-template-columns: 32px 1fr; gap: 12px; }
.avatar { width: 32px; height: 32px; border-radius: 8px; background: var(--white); display: grid; place-items: center; }
.avatar svg { width: 18px; height: 18px; }
.items { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.note { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.note svg { width: 18px; height: 18px; }
.note.bolt { color: var(--accent); }
.reply.error { color: var(--bad); }
.timing { font: var(--caption); color: var(--muted); }
.kicker { display: flex; align-items: center; gap: 8px; font: var(--label); color: var(--muted); }
.kicker svg { width: 16px; height: 16px; }
.voice { font: var(--caption); color: var(--muted); margin-left: auto; }
.inner { background: rgba(255,255,255,.05); }   /* cards inside the main panel */

.step { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; }
.step .ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
.step .ico svg { width: 16px; height: 16px; }
.step.running .ico { border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.step.done .ico { background: var(--ok); color: var(--ink); }
.step.failed .ico { background: var(--bad); color: var(--ink); }
.step.undone .ico { background: var(--muted); color: var(--ink); }
.step .title { font: var(--title); }
.step .detail { color: var(--muted); }
.step.failed .detail { color: var(--bad); }
.step .state { font: var(--label); color: var(--muted); }
.step.done .state { color: var(--ok); }
.step.failed .state { color: var(--bad); }
.step .voice { grid-column: 2 / 4; margin: 0; }
.said-card .kicker { color: var(--accent); }
.typed-card .kicker { color: var(--ok); }
.typed-card.failed .kicker { color: var(--bad); }
.said-card .words, .typed-card .words { font: var(--title); margin-top: 6px; }
.said-card.undone .words, .typed-card.undone .words { text-decoration: line-through; color: var(--muted); }
.typed-card .problem { color: var(--bad); }
.email { grid-column: 2 / 4; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.email div { overflow-wrap: anywhere; } .email b { color: var(--muted); font-weight: 500; display: inline-block; min-width: 76px; }
.undo { grid-column: 1 / 4; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin-top: 12px; }
.undo button { border: 1px solid var(--line-strong); background: transparent; border-radius: 10px; padding: 0 16px; font-weight: 600; min-height: var(--target); display: inline-flex; align-items: center; gap: 8px; }
.undo .bar { flex: 1; min-width: 80px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.undo .bar i { display: block; height: 100%; background: var(--warn); transform-origin: left; }
.resolved { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); }
.resolved .q { color: var(--text); }
.resolved .a { font: var(--label); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
.resolved.allowed .a, .resolved.picked .a { color: var(--ok); }
.resolved.denied .a { color: var(--bad); }
.resolved .by { font: var(--caption); }

/* ---- question cards (the only card with a shadow) ---- */
.perm { background: var(--tint-strong); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.perm.fresh { animation: rise .2s ease-out; }
.perm { position: relative; }
.perm .qcam { position: absolute; top: 16px; right: 16px; width: 120px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px;
              background: #000; border: 1px solid var(--line); }
.perm.with-cam .perm-title, .perm.with-cam .perm-head { margin-right: 136px; }   /* only the first time a question is shown (else it flickers) */
.perm-head { display: flex; align-items: center; gap: 8px; font: var(--label); color: var(--muted); }
.perm.risky .perm-head { color: var(--bad); }
.perm-head svg { width: 18px; height: 18px; }
.perm-title { font: var(--title); margin: 8px 0 0; }
.perm-body { font: var(--display); margin: 6px 0 16px; overflow-wrap: anywhere; }
.perm.guess .perm-body { font-style: italic; }
.perm .tagline { display: inline-block; font: var(--label); color: var(--warn); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; margin-top: 8px; }
.perm .email { margin: 0 0 16px; }
.buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 76px; padding: 12px 18px; border-radius: 12px;
       border: 1px solid var(--line-strong); background: rgba(255,255,255,.06); font: var(--title); text-align: left; position: relative; overflow: hidden; color: var(--text); }
/* The only solid white button on screen: Yes, or the option being chosen. */
.btn.primary { background: var(--white); color: var(--ink); border-color: var(--white); }
.perm.risky .btn.primary { box-shadow: inset 0 0 0 3px var(--bad); }
.btn .labels { display: flex; flex-direction: column; min-width: 0; }
.btn .outcome { font: var(--label); color: inherit; opacity: .8; }
.btn .doing { display: none; align-items: center; gap: 10px; }
.btn.primary:hover .now, .btn.primary:focus-visible .now, .btn.primary.holding .now { display: none; }
.btn.primary:hover .doing, .btn.primary:focus-visible .doing, .btn.primary.holding .doing { display: inline-flex; }
.btn.primary:hover .outcome, .btn.primary:focus-visible .outcome, .btn.primary.holding .outcome { visibility: hidden; }
.loop { width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(26,20,17,.25); border-top-color: var(--ink); animation: spin .9s linear infinite; }
.btn .how { display: flex; align-items: center; gap: 6px; flex: none; }
.key { font: var(--label); padding: 2px 7px; border-radius: 6px; border: 1px solid currentColor; }
.gest { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
.gest .gi { display: inline-flex; width: 24px; height: 24px; }
.gest .gi svg { width: 24px; height: 24px; }
.gest small { font: var(--caption); margin-top: 3px; }
.btn .fill { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--accent); width: calc(var(--p, 0) * 100%); transition: width .1s linear; }
.grid4, .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt { min-height: 96px; align-items: flex-start; flex-direction: column; justify-content: space-between; }
.opt .num { font: var(--label); font-weight: 700; background: var(--white); color: var(--ink); border-radius: 6px; padding: 2px 9px; }
.opt.primary .num, .opt:hover .num, .opt:focus-visible .num { background: var(--ink); color: var(--white); }
.opt .row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.opt .hint { display: inline-flex; align-items: center; gap: 8px; font: var(--label); opacity: .85; }
.opt .hint svg { width: 20px; height: 20px; }
.opt .txt { overflow-wrap: anywhere; }
.opt.else:not(.primary) { font-style: italic; }
.opt:hover, .opt:focus-visible { background: var(--white); color: var(--ink); border-color: var(--white); }
.none-row { display: flex; justify-content: center; margin-top: 12px; }
.none-btn { border: 1px solid var(--line-strong); background: transparent; border-radius: 12px; padding: 0 18px; min-height: var(--target); display: flex; gap: 10px; align-items: center; }
.values { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.values button { border: 1px solid var(--line-strong); background: transparent; border-radius: 12px; padding: 0 16px; font-weight: 600; min-height: var(--target); }
.detail-row { display: flex; gap: 10px; }
.detail-row input { flex: 1; min-height: var(--target); border: 1px solid var(--line-strong); border-radius: 12px; padding: 0 14px; background: rgba(0,0,0,.25); }
.detail-row button { min-height: var(--target); border-radius: 12px; border: 1px solid var(--white); background: var(--white); color: var(--ink); font-weight: 600; padding: 0 20px; }
.answer-hint { margin-top: 12px; font: var(--label); color: var(--muted); }
.closes { height: 4px; border-radius: 2px; background: var(--line); margin-top: 14px; overflow: hidden; }
.closes i { display: block; height: 100%; background: var(--line-strong); }

/* ---- composer ---- */
.composer-wrap { padding: 10px 20px 16px; position: relative; }
.composer { max-width: 760px; margin: 0 auto; padding: 12px 12px 12px 18px; border-radius: 14px; background: rgba(255,255,255,.06); }
.composer input { width: 100%; border: 0; background: transparent; min-height: var(--target); padding: 0; }
.composer input::placeholder { color: var(--muted); opacity: 1; }
.composer input:focus { outline: none; }
.composer:focus-within { border-color: var(--line-strong); }
.composer-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.composer-row .grow { flex: 1; }
/* Icon-only round buttons, as in Cowork's own composer: 40px circle inside a 48px clickable area,
   thin line icons, the state told by colour, a tooltip and the aria-label (no text on the button). */
.ibtn { position: relative; display: inline-grid; place-items: center; width: var(--target); height: var(--target); padding: 0; border: 0;
        background: transparent; color: var(--muted); border-radius: 50%; flex: none; }
.ibtn[hidden] { display: none; }
.ibtn::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: transparent; transition: background .12s; }
.ibtn:hover::before { background: var(--hover); }
.ibtn svg { position: relative; width: 20px; height: 20px; }
.ibtn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.ibtn[aria-disabled="true"]:hover::before { background: transparent; }
.ibtn .sdot { position: absolute; right: 9px; top: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 2px #1d1d20; }
.ibtn .sdot.on { background: var(--ok); }
/* Speak: listening turns the mic red-orange, with a soft ring that follows the sound level (--lvl, 0..1) */
.ibtn.mic .ring { position: absolute; inset: 4px; border-radius: 50%; border: 2px solid var(--live); opacity: 0; pointer-events: none;
                  transform: scale(calc(1 + var(--lvl, 0) * .32)); transition: transform .08s linear, opacity .15s; }
.ibtn.mic.listening { color: var(--live); }
.ibtn.mic.listening::before { background: rgba(255, 122, 89, .14); }
.ibtn.mic.listening .ring { opacity: .85; animation: breathe 1.6s ease-in-out infinite; }
.ibtn.mic.busy { color: var(--accent); }
@keyframes breathe { 50% { opacity: .35; } }
/* Send: a filled round up-arrow, solid only when there is text */
.ibtn.send::before { background: rgba(255,255,255,.10); }
.ibtn.send.ready { color: var(--ink); }
.ibtn.send.ready::before { background: var(--white); }
.ibtn.send svg { width: 18px; height: 18px; }
/* Tooltip: one small dark label, after half a second of hover, or at once on keyboard focus */
.tip { position: fixed; z-index: 60; padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.92); color: var(--white); font: var(--label);
       white-space: nowrap; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.tip[hidden] { display: none; }
.live { display: flex; align-items: center; gap: 12px; margin-top: 10px; min-height: 28px; }
.live[hidden], .mic-why[hidden] { display: none; }
.meter { width: 140px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .08s linear; }
.partial { font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mic-why { margin-top: 6px; }
.clips { position: absolute; bottom: calc(100% + 4px); right: max(20px, calc((100% - 760px) / 2)); width: 460px; max-height: 60vh; overflow-y: auto; padding: 12px; z-index: 20;
         background: var(--tint-strong); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.clips[hidden] { display: none; }
.clips h4 { margin: 6px 8px 8px; font: var(--label); color: var(--muted); }
.clips button { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent;
                border-radius: 10px; padding: 8px 10px; min-height: var(--target); }
.clips button:focus-visible, .clips button:hover { background: var(--hover); }
.clips .play { width: 34px; height: 34px; border-radius: 50%; background: var(--white); color: var(--ink); display: grid; place-items: center; }
.clips .play svg { width: 14px; height: 14px; }
.clips .secs { font: var(--caption); color: var(--muted); }
.clips .clip-label { display: block; font: var(--label); color: var(--muted); }
.clips .step-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--white); color: var(--ink); font: var(--caption); font-weight: 700; margin-right: 4px; }
.clips .caption { margin: 8px; }

/* ---- Conference mode: a calm view, readable from across a table ---- */
.mode-label { max-width: 760px; margin: 0 auto 6px; padding-left: 18px; font: var(--label); color: var(--accent); }
.mode-label[hidden] { display: none; }
.conf { max-width: 860px; margin: 0 auto; padding: 22px 26px 30px; display: flex; flex-direction: column; gap: 22px; min-height: 100%; }
.conf-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font: var(--label); }
.conf-head .badge { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 600; }
.conf-head .badge svg { width: 18px; height: 18px; }
.conf-head .ways { margin-left: auto; }
.transcript { display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; min-height: 160px; }
.transcript .past { font: 400 24px/1.35 var(--serif); color: var(--muted); margin: 0; }
.transcript .past.stopped { text-decoration: line-through; opacity: .7; }
.transcript .now { font: 500 46px/1.2 var(--serif); margin: 0; overflow-wrap: anywhere; }
.transcript .now.stopped { text-decoration: line-through; color: var(--muted); }
.transcript .state { display: flex; align-items: center; gap: 10px; font: var(--title); font-weight: 500; color: var(--muted); }
.transcript .state svg { width: 22px; height: 22px; }
.transcript .state.preparing { color: var(--warn); }
.transcript .state.speaking { color: var(--accent); }
.transcript .state.said { color: var(--ok); }
.transcript .state .loop { border-color: rgba(242,196,107,.3); border-top-color: var(--warn); }
.transcript .empty-said { font: 400 28px/1.35 var(--serif); color: var(--muted); margin: 0; }
.conf-quick h3 { font: var(--label); color: var(--muted); margin: 0 0 10px; }
.conf-quick .btn { min-height: 84px; }
.conf .working { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.conf .working svg { width: 20px; height: 20px; }

/* ---- right column: folded rows ---- */
.rail { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; }
.row { padding: 0; overflow: hidden; flex: none; }
.row-head { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 0 20px; border: 0; background: transparent; text-align: left; color: var(--text); }
.row-head:hover { background: var(--hover); }
.row-head > svg:first-child { width: 20px; height: 20px; color: var(--muted); }
.row-head .rt { font: var(--body); font-weight: 600; }
.row-head .rs { font: var(--label); color: var(--muted); }
.row-head .chev { width: 16px; height: 16px; margin-left: auto; color: var(--muted); transition: transform .15s; }
.row-head[aria-expanded="true"] .chev { transform: rotate(180deg); }
.row-body { padding: 0 20px 20px; }
.row-body[hidden] { display: none; }
.progress { list-style: none; margin: 0; padding: 0; }
.progress li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 6px 0; align-items: start; }
.progress .pi { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; margin-top: 1px; }
.progress .pi svg { width: 13px; height: 13px; }
.progress li.done .pi { background: var(--ok); border-color: var(--ok); color: var(--ink); }
.progress li.failed .pi { background: var(--bad); border-color: var(--bad); color: var(--ink); }
.progress li.running .pi { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
.progress li.open .pi { border-color: var(--accent); }
.progress li.seen { color: var(--muted); }
.progress li.seen .pi { border-style: dashed; }
.progress .muted, .feed-empty { color: var(--muted); }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { padding: 10px 0; border-top: 1px solid var(--line); }
.feed li:first-child { border-top: 0; }
.feed .kind { display: inline-flex; align-items: center; gap: 5px; font: var(--label); font-weight: 600; margin-bottom: 2px; }
.feed .kind svg { width: 13px; height: 13px; }
.feed .k-learned { color: var(--ok); }
.feed .k-fast { color: var(--accent); }
.feed .k-undo { color: var(--bad); }
.cam img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; background: #000; }
.cam .pic { position: relative; }
.cam .off { min-height: 140px; display: grid; place-items: center; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.cam .off svg { width: 28px; height: 28px; margin-bottom: 6px; color: var(--muted); }
.cam .cap { font: var(--label); color: var(--muted); padding-top: 10px; display: flex; align-items: center; gap: 8px; }
.cam .rec { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
.cam .ring { position: absolute; top: 10px; left: 10px; width: 54px; height: 54px; }
.cam .ring circle { fill: none; stroke-width: 6; }

/* ---- modal (Quick Actions, lists, Settings, Help) ---- */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: start center; padding-top: 12vh; z-index: 40; }
.backdrop[hidden] { display: none; }
.modal { width: min(640px, calc(100vw - 32px)); max-height: 70vh; display: flex; flex-direction: column; background: rgba(20, 20, 22, 0.98);
         box-shadow: 0 20px 50px rgba(0,0,0,.45); padding: 0; overflow: hidden; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 20px; border-bottom: 1px solid var(--line); }
.modal-head > svg { width: 20px; height: 20px; color: var(--muted); }
.modal-head h2 { font: var(--title); margin: 0; flex: 1; }
.modal-head input { flex: 1; min-height: var(--target); border: 0; background: transparent; font: var(--title); font-weight: 400; }
.modal-head input:focus { outline: none; }
.modal-head input::placeholder { color: var(--muted); }
.icon-btn { width: var(--target); height: var(--target); border-radius: 10px; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; }
.icon-btn svg { width: 18px; height: 18px; }
.modal-body { overflow-y: auto; padding: 8px; }
.modal-body p { margin: 8px 12px; }
.qa { display: grid; grid-template-columns: 28px 24px 1fr auto; align-items: center; gap: 10px; width: 100%; min-height: var(--target); padding: 6px 12px;
      border: 0; border-radius: 10px; background: transparent; text-align: left; color: var(--text); }
.qa .n { font: var(--caption); font-weight: 700; color: var(--muted); text-align: center; }
.qa svg { width: 18px; height: 18px; color: var(--muted); }
.qa .kind { font: var(--caption); color: var(--muted); }
.qa.sel { background: var(--white); color: var(--ink); }
.qa.sel svg, .qa.sel .kind, .qa.sel .n { color: var(--ink); }
.qa-group { font: var(--caption); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 10px 12px 4px; }
.modal-foot { padding: 10px 20px; border-top: 1px solid var(--line); font: var(--label); color: var(--muted); }
table.plain { border-collapse: collapse; width: calc(100% - 24px); margin: 8px 12px; }
table.plain td { padding: 10px 0; border-top: 1px solid var(--line); vertical-align: top; }
table.plain td:first-child { color: var(--muted); width: 40%; padding-right: 12px; }
.setting { display: flex; align-items: center; gap: 14px; padding: 12px; }
.setting .what { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
.seg button { min-height: var(--target); padding: 0 18px; border: 0; background: transparent; font: var(--label); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--white); color: var(--ink); }

/* ---- Results (TORGO M04) ---- */
.modal.wide { width: min(760px, calc(100vw - 32px)); max-height: 84vh; }
.results { padding: 6px 12px 12px; }
.results .lead { color: var(--muted); margin: 6px 0 14px; }
.results svg { width: 100%; height: auto; display: block; }
.results .bar-label { fill: var(--text); font: 600 15px var(--sans); }
.results .bar-sub { fill: var(--muted); font: 400 13px var(--sans); }
.results .bar-value { fill: var(--text); font: 600 15px var(--sans); }
.results .grid line { stroke: var(--line); stroke-width: 1; }
.results .grid text { fill: var(--muted); font: 400 11px var(--sans); }
.results .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
.results .stat { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.results .stat b { display: block; font: var(--display); font-size: 34px; line-height: 1.1; }
.results .stat span { color: var(--muted); font: var(--label); }
.results ul { margin: 0; padding-left: 20px; }
.results li { margin: 6px 0; }
.results h3 { font: var(--label); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 18px 0 6px; }
.teach-row { display: flex; align-items: center; gap: 12px; }
.teach-row span { flex: 1; }
.teach-btn { min-height: 40px; border-radius: 10px; padding: 0 14px; border: 1px solid var(--line-strong); background: transparent; font: var(--label); font-weight: 600; flex: none; }
.teach-btn:hover { background: var(--hover); }
.teach { max-width: 760px; margin: 0 auto; }
.teach .phrase { font: var(--display); margin: 8px 0 18px; }
.teach .count { font: var(--title); color: var(--accent); }
.teach ol { margin: 14px 0; padding-left: 22px; }
.teach li { margin: 6px 0; color: var(--muted); }
.teach li b { color: var(--text); font-weight: 500; }
.teach .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.teach .row button { min-height: var(--target); border-radius: 12px; padding: 0 18px; font-weight: 600; border: 1px solid var(--line-strong); background: transparent; }
.link-btn { border: 0; background: transparent; padding: 0; min-height: 0; color: var(--accent); text-decoration: underline; font: inherit; text-align: left; }
.toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); background: var(--white); color: var(--ink); padding: 12px 18px; border-radius: 12px; max-width: 640px; z-index: 50; }
.toast[hidden] { display: none; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
html.still *, html.still *::before, html.still *::after { animation: none !important; transition: none !important; }   /* screenshots */
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 1180px) { .app { --side-w: 220px; --rail-w: 250px; } }
@media (max-width: 960px) {
  .app { --side-w: 200px; --rail-w: 230px; }
  .buttons, .grid4 { grid-template-columns: 1fr; }
  .clips { width: auto; left: 16px; right: 16px; }
  .convo { padding: 20px 16px 32px; }
  .composer-row { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="app rail-collapsed">
  <aside class="side card" aria-label="Navigation">
    <div class="side-top">
      <button type="button" class="toggle-btn" id="sideToggle" aria-label="Collapse sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="quick-open" id="quickBtn" aria-haspopup="dialog" aria-label="Quick actions" title="Quick actions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    </div>
    <div class="group">Tasks</div>
    <button class="nav" id="newTask" data-icon="plus">New task</button>
    <button class="nav" id="recentBtn" data-icon="clock" aria-expanded="false" aria-controls="recent">Recent tasks<span class="count" id="recentCount"></span></button>
    <ul class="recent" id="recent" hidden></ul>
    <div class="group">Your voice</div>
    <button class="nav" data-view="phrases" data-icon="quote">Phrases</button>
    <button class="nav" data-view="learned" data-icon="learn">Learned</button>
    <button class="nav" data-view="gestures" data-icon="hand">Gestures</button>
    <div class="group">Apps</div>
    <button class="nav" data-app="Google Chrome" data-icon="globe">Chrome</button>
    <button class="nav" data-app="Mail" data-icon="mail">Mail</button>
    <button class="nav" data-app="Notes" data-icon="note">Notes</button>
    <button class="nav" data-app="Microsoft Word" data-icon="doc">Word</button>
    <div class="spacer"></div>
    <button class="nav" data-view="settings" data-icon="gear">Settings</button>
    <button class="nav" data-view="help" data-icon="help">Help</button>
  </aside>

  <main class="main card">
    <div class="scroll" id="scroll"><div class="convo" id="convo" aria-live="polite"></div></div>
    <div class="composer-wrap">
      <div class="clips card" id="clips" hidden></div>
      <div class="mode-label" id="modeLabel" hidden>Conference mode: speaking for you</div>
      <div class="mode-label" id="writingLabel" role="status" hidden></div>
      <form class="composer card" id="typeForm" autocomplete="off">
        <label class="sr" for="typed">Type what was said</label>
        <input id="typed" placeholder="Type what was said, or press the mic…">
        <div class="composer-row">
          <button type="button" class="ibtn mic" id="speak" aria-label="Speak" data-tip="Speak" aria-pressed="false"><span class="ring" aria-hidden="true"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11.5" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          </button>
          <button type="button" class="ibtn" id="dictBtn" aria-pressed="false" aria-label="Dictation off" data-tip="Dictation off">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M6.5 13.5h.01M17 13.5h.01M9.5 14h5"/></svg><span class="sdot" id="dictDot" aria-hidden="true"></span>
          </button>
          <button type="button" class="ibtn" id="clipBtn" aria-haspopup="true" aria-expanded="false" aria-label="Test clips" data-tip="Test clips">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 12h1.5M7 8.5v7M10.5 5v14M14 9v6M17.5 6.5v11M21 11v2"/></svg>
          </button>
          <button type="button" class="ibtn mode" id="modeBtn" aria-pressed="false" aria-label="Switch to Conference mode" data-tip="Switch to Conference mode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" id="modeIcon"></svg>
          </button>
          <span class="grow"></span>
          <button type="submit" class="ibtn send" id="sendBtn" aria-label="Send" data-tip="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
        </div>
        <div class="live" id="live" hidden>
          <span class="meter" aria-hidden="true"><i id="meterFill"></i></span>
          <span class="partial" id="partial" aria-live="polite">Listening… speak now</span>
        </div>
        <div class="caption mic-why" id="micWhy" role="status" hidden></div>
      </form>
    </div>
  </main>

  <aside class="rail" aria-label="Camera, progress and learning">
    <button type="button" class="rail-toggle" id="railToggle" title="Expand panel" aria-label="Expand panel" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <section class="row card cam" id="camRow">
      <button class="row-head" data-row="camera" aria-expanded="false" aria-controls="camBody"></button>
      <div class="row-body" id="camBody" hidden></div>
    </section>
    <section class="row card" id="progressRow">
      <button class="row-head" data-row="progress" aria-expanded="false" aria-controls="progressBody"></button>
      <div class="row-body" id="progressBody" hidden><ul class="progress" id="progress"></ul></div>
    </section>
    <section class="row card" id="learnedRow">
      <button class="row-head" data-row="learned" aria-expanded="false" aria-controls="learnedBody"></button>
      <div class="row-body" id="learnedBody" hidden><ul class="feed" id="feed"></ul></div>
    </section>
  </aside>
</div>

<div class="backdrop" id="backdrop" hidden>
  <div class="modal card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal"></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script>
"use strict";
if (location.search.includes("still")) document.documentElement.classList.add("still");
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }).then((r) => r.json()).catch(() => ({}));
const sv = (d, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;

const ICON = {
  check: sv('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 'stroke-width="3.2"'),
  x: sv('<path d="M6 6l12 12M18 6L6 18"/>', 'stroke-width="3.2"'),
  undo: sv('<path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/>'),
  bolt: sv('<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'),
  learn: sv('<path d="M12 3l9 5-9 5-9-5z"/><path d="M7 10.5V15c0 1.5 2.5 3 5 3s5-1.5 5-3v-4.5"/>'),
  ear: sv('<path d="M6 9a6 6 0 1 1 12 0c0 4-4 5-4 9a3 3 0 0 1-6 0"/>'),
  eye: sv('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
  speaker: sv('<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>'),
  shield: sv('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>'),
  warn: sv('<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>'),
  keys: sv('<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>'),
  cam: sv('<path d="M23 7l-7 5 7 5z"/><rect x="1" y="5" width="15" height="14" rx="2"/>'),
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',
  mark: '<svg viewBox="0 0 24 24" fill="none" stroke="#1A1411" stroke-width="2.4" stroke-linecap="round"><path d="M4 12h2M8 8v8M12 5v14M16 8v8M20 12h0"/></svg>',
  plus: sv('<path d="M12 5v14M5 12h14"/>'),
  clock: sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  quote: sv('<path d="M5 7h14M5 12h14M5 17h9"/>'),
  hand: sv('<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4a1.5 1.5 0 0 1 3 0v8M14 11V5.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7 6 6 0 0 1-5-3l-2.5-4.5a1.5 1.5 0 0 1 2.5-1.5L8 15"/>'),
  globe: sv('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'),
  mail: sv('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'),
  note: sv('<path d="M5 3h10l4 4v14H5z"/><path d="M9 11h6M9 15h6"/>'),
  doc: sv('<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h4"/>'),
  gear: sv('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'),
  help: sv('<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17v.5"/>'),
  search: sv('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),
  chev: sv('<path d="M6 9l6 6 6-6"/>', 'class="chev"'),
  close: sv('<path d="M6 6l12 12M18 6L6 18"/>'),
  progress: sv('<path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>'),
  wave: sv('<path d="M4 12h2M8 8v8M12 5v14M16 8v8M20 11v2"/>'),
  cmd: sv('<path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3z"/>'),
};
document.querySelectorAll("[data-icon]").forEach((b) => b.insertAdjacentHTML("afterbegin", ICON[b.dataset.icon] || ""));

// The hand signals each answer accepts (same meaning as choose/meaning.py), as line icons.
const SVG_HAND = ICON.hand, SVG_THUMB = sv('<path d="M7 11v10H4a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h3zM7 11l4-8a2.5 2.5 0 0 1 3 2.5V9h5a2 2 0 0 1 2 2.3l-1.2 7.4A2.5 2.5 0 0 1 17.3 21H7"/>');
function gest(kind, side) {   // kind: "hand", "up", "down"; side: "left", "right" or "" (either hand)
  const icon = kind === "hand" ? SVG_HAND : SVG_THUMB;
  const turn = (side === "left" ? "scaleX(-1)" : "") + (kind === "down" ? " scaleY(-1)" : "");

  if (e.metaKey && !e.shiftKey && !e.altKey && ["1", "2", "3"].includes(e.key)) {
    e.preventDefault();
    post("/api/clip", { id: "demo" + e.key }).then((r) => r && r.problem && showToast(r.problem));
    return;
  }
  // Esc twice quickly: stop everything (the first Esc still does its usual job)
  if (e.key === "Escape") {
    const now = Date.now();
    if (now - lastEsc <= 1000) { lastEsc = 0; e.preventDefault(); post("/api/stop"); return; }
    lastEsc = now;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); modalView === "quick" ? closeModal() : openModal("quick"); return; }
  if (modalView) {
    if (e.key === "Escape") { e.preventDefault(); closeModal(); return; }
    if (modalView === "quick") {
      if (e.key === "ArrowDown") { e.preventDefault(); qaSel = Math.min(qaSel + 1, qaVisible.length - 1); renderQuickList(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); qaSel = Math.max(qaSel - 1, 0); renderQuickList(); }
      else if (e.key === "Enter") { e.preventDefault(); chooseQuick(document.activeElement && document.activeElement.dataset.qa !== undefined ? +document.activeElement.dataset.qa : qaSel); }
      else if (/^[1-9]$/.test(e.key) && !qaFilter) { e.preventDefault(); chooseQuick(+e.key - 1); }
    }
    return;
  }
  const q = S.question, typing = document.activeElement && document.activeElement.tagName === "INPUT";
  if (e.key === "Escape" && !$("clips").hidden) { hideClips(); return; }
  if (!q) {
    if (e.key === " " && !typing && document.activeElement === document.body) { e.preventDefault(); post("/api/listen", { toggle: true }); }
    else if (S.mode === "conference" && !typing && /^[1-4]$/.test(e.key)) { e.preventDefault(); post("/api/quick", { index: +e.key - 1 }); }
    return;
  }
  if (q.kind === "window") {
    if (e.key === "Escape") { e.preventDefault(); post("/api/answer", { kind: "no" }); }
    else if (S.mode === "conference" && !typing && /^[1-4]$/.test(e.key)) { e.preventDefault(); post("/api/quick", { index: +e.key - 1 }); }   // never blocked by the undo window
    return;
  }
  if (q.kind === "detail") return;
  if (typing && $("typed").value) return;
  if (q.kind === "yes_no") {
    if (e.key === "Enter" && !(document.activeElement && document.activeElement.dataset.answer === "no")) { e.preventDefault(); post("/api/answer", { kind: "yes" }); }
    else if (e.key === "Escape") { e.preventDefault(); post("/api/answer", { kind: "no" }); }
  } else if (q.kind === "choice") {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= (q.options || []).length) { e.preventDefault(); post("/api/answer", { kind: "pick", value: n - 1 }); }
    else if (e.key === "Escape") { e.preventDefault(); post("/api/answer", { kind: "none" }); }
  }
});

// ---- live updates ---------------------------------------------------------------------------
function connect() {
  const source = new EventSource("/api/stream");
  source.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "level") {
      const pct = Math.max(0, Math.min(100, (msg.level + 60) * 1.8));
      $("meterFill").style.width = pct + "%";
      $("meterFill").style.background = msg.speaking ? "var(--accent)" : "var(--ok)";
      if ($("speak").classList.contains("listening")) $("speak").style.setProperty("--lvl", (pct / 100).toFixed(2));   // the ring follows the sound
      return;
    }
    if (msg.state) render(msg.state);
  };
  source.onerror = () => { source.close(); setTimeout(connect, 1000); };
}
fetch("/api/state").then((r) => r.json()).then(render).catch(() => {});
connect();
</script>
