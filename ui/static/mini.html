<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cowork mini</title>
<!-- The small window in the top right corner (like your own video in a call while you share your screen).
     Fully offline: served by ui/server.py on this Mac only. It never takes the keyboard from the app in use. -->
<style>
:root {
  --tint: rgba(12, 12, 14, 0.80);
  --line: rgba(255, 255, 255, 0.16);
  --text: #FFFFFF;
  --muted: #D6D6DA;
  --accent: #F2A385;
  --ok: #8FDDA5;
  --bad: #FFA294;
  --ink: #1A1411;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
}
html.plain { --tint: #141416; }
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; color: var(--text); font: 400 15px/1.4 var(--sans); -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; overflow: hidden; }
#box { position: relative; margin: 0; padding: 12px 14px 12px; background: var(--tint); border: 1px solid var(--line); border-radius: 14px; }
/* A question that couldn't be said aloud: a gentle glow until it is answered (inside the box: the
   native window is exactly the box's size, so nothing outside it would show) */
#box.attention { border-color: var(--accent); animation: glow 2.4s ease-in-out infinite; }
@keyframes glow { 0%, 100% { box-shadow: inset 0 0 14px rgba(242,163,133,.28); } 50% { box-shadow: inset 0 0 26px rgba(242,163,133,.55); } }
.top { display: flex; align-items: center; gap: 10px; min-height: 40px; cursor: pointer; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
.listening .dot { background: var(--ok); animation: pulse 1.2s ease-in-out infinite; }
.thinking .dot, .hearing .dot { background: var(--accent); animation: pulse .8s ease-in-out infinite; }
.speaking .dot { background: #8DB6FF; animation: pulse .6s ease-in-out infinite; }
.paused .dot { background: transparent; border: 2px solid var(--muted); }
@keyframes pulse { 50% { opacity: .35; } }
.status { flex: 1; min-width: 0; }
.status b { display: block; font: 600 17px/1.25 var(--sans); }
.status span { display: block; font: 400 13px/1.35 var(--sans); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .12s linear; }
.expand { position: relative; flex: none; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
  background: transparent; color: var(--muted); cursor: pointer; }
.expand::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: rgba(255,255,255,.08); }
.expand:hover::before { background: rgba(255,255,255,.16); }
.expand svg { position: relative; width: 18px; height: 18px; }
/* tooltip: inside the box (the native window is only as big as the box), to the left of the button */
.tip { position: absolute; z-index: 5; padding: 5px 9px; border-radius: 7px; background: rgba(0,0,0,.92); color: #fff; font: 500 13px/1.3 var(--sans);
  white-space: nowrap; pointer-events: none; }
.tip[hidden] { display: none; }
.q { margin-top: 10px; }
.q-row { display: flex; gap: 10px; align-items: flex-start; }
.q-text { flex: 1; min-width: 0; }
.q-title { font: 600 16px/1.3 var(--sans); }
.q-body { margin-top: 4px; font: 500 15px/1.35 var(--sans); color: var(--text); }
.cam { width: 84px; height: 63px; border-radius: 8px; object-fit: cover; flex: none; background: rgba(255,255,255,.08); }   /* same picture as the full window */
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.btn { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.08); color: var(--text);
  font: 600 15px/1.2 var(--sans); cursor: pointer; padding: 6px 8px; text-align: left; position: relative; overflow: hidden; }
.btn.yes { background: #FFFFFF; color: var(--ink); border-color: #FFFFFF; }
.btn small { display: block; font: 400 11px/1.3 var(--sans); opacity: .8; margin-top: 2px; }
.btn .num { display: inline-block; min-width: 18px; font-weight: 700; color: var(--accent); }
.btn.yes .num { color: var(--ink); }
.btn .fill { position: absolute; left: 0; bottom: 0; height: 4px; width: calc(var(--p, 0) * 100%); background: var(--accent); }
.btn.holding { outline: 3px solid var(--accent); }
.none { margin-top: 8px; width: 100%; min-height: 36px; border-radius: 10px; border: 1px dashed var(--line); background: transparent; color: var(--muted);
  font: 500 13px var(--sans); cursor: pointer; }
.hint { margin-top: 8px; font: 400 12px/1.35 var(--sans); color: var(--muted); }
:focus-visible { outline: 3px solid #8DB6FF; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="box" role="region" aria-label="Cowork">
  <div class="top paused" id="top" title="Click to stop or start listening">
    <span class="dot" aria-hidden="true"></span>
    <div class="status" aria-live="polite"><b id="what">Cowork</b><span id="sub"></span><div class="meter" id="meter" hidden><i id="level"></i></div></div>
    <button class="expand" id="expand" aria-label="Open Cowork" data-tip="Open Cowork"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg></button>
  </div>
  <div class="q" id="q" hidden></div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const YES = ["RIGHT", "RIGHT_UP", "LEFT_UP"], NO = ["LEFT", "RIGHT_DOWN", "LEFT_DOWN"];   // as in cowork.html
const GRID = ["LEFT_UP", "RIGHT_UP", "LEFT_DOWN", "RIGHT_DOWN"];
let S = null, lastQ = "", camTimer = null;
try { if (localStorage.getItem("cowork-look") === "plain") document.documentElement.classList.add("plain"); } catch (e) {}
function post(url, body) { return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }).catch(() => {}); }
function tellHeight() {   // the native window follows the page's height (kept at the top right corner)
  try { window.webkit.messageHandlers.cowork.postMessage({ mini_height: Math.ceil($("box").getBoundingClientRect().height) }); } catch (e) {}
}
function statusOf(s) {
  const mic = s.mic || {}, win = s.window || {};
  if (s.question && s.question.kind !== "window") return ["asking", "Your answer, please", "Thumb, hand, voice or keys"];
  if (s.speaking) return ["speaking", "Speaking", s.speaking];
  if (s.status === "hearing") return ["hearing", "Hearing…", mic.partial || ""];
  if (s.status === "thinking" || s.status === "listening again" || (s.turn && !s.turn.finished && s.status !== "ready"))
    return ["thinking", "Thinking…", (s.turn && (s.turn.request || "“" + s.turn.heard + "”")) || ""];
  if (mic.listening) return ["listening", "Listening", mic.partial ? `Heard so far: ${mic.partial}` : "Esc or click here to stop"];
  if (!mic.on) return ["paused", "Microphone off", "Open Cowork to type a request"];
  return ["paused", "Not listening", win.hands_free ? "One moment…" : "Click here to listen again"];
}
function questionHtml(q) {
  const c = q.card || {};
  let html = `<div class="q-row"><div class="q-text"><div class="q-title">${esc(c.title)}</div>${c.body ? `<div class="q-body">${c.say_aloud ? "“" + esc(c.body) + "”" : esc(c.body)}</div>` : ""}</div>`;
  html += (S.camera && S.camera.on) ? `<img class="cam" id="cam" alt="Camera: show your thumb">` : "";
  html += "</div>";
  if (q.kind === "yes_no") {
    html += `<div class="btns"><button class="btn" data-answer="no" data-signals="no">${esc(c.deny || "No")}<small>Esc · left hand / thumb down</small><span class="fill"></span></button>
      <button class="btn yes" data-answer="yes" data-signals="yes">${esc(c.allow || "Yes")}<small>Enter · right hand / thumb up</small><span class="fill"></span></button></div>`;
    html += `<div class="hint">Say yes or no, show your thumb, or press Enter / Esc.</div>`;
  } else if (q.kind === "choice") {
    html += `<div class="btns">` + (c.options || []).slice(0, 4).map((o, i) =>
      `<button class="btn" data-pick="${i}" data-signal="${GRID[i]}"><span class="num">${i + 1}</span> ${esc(o.text)}<span class="fill"></span></button>`).join("") + "</div>";
    html += `<button class="none" data-answer="none">None of these · Esc</button><div class="hint">Say the number, point with your thumb, or press 1–4.</div>`;
  } else if (q.kind === "detail") {
    html += `<div class="hint">Open Cowork to type the answer, or say it.</div>`;
  }
  return html;
}
function applyHold(s) {
  const hold = s.hold && s.hold.signal ? s.hold : null;
  document.querySelectorAll("#q button[data-signals], #q button[data-signal]").forEach((b) => {
    const signals = b.dataset.signal ? [b.dataset.signal] : b.dataset.signals === "yes" ? YES : NO;
    const on = !!hold && signals.includes(hold.signal);
    b.classList.toggle("holding", on);
    if (on) b.style.setProperty("--p", hold.progress); else b.style.removeProperty("--p");
  });
}
function render(s) {
  S = s;
  const [cls, what, sub] = statusOf(s);
  $("top").className = "top " + cls;
  $("box").classList.toggle("attention", !!(s.attention && s.question));
  $("what").textContent = what;
  $("sub").textContent = sub;
  $("meter").hidden = cls !== "listening";
  const q = s.question && s.question.kind !== "window" ? s.question : null;
  const key = q ? q.id + ":" + (s.camera && s.camera.on) : "";
  if (key !== lastQ) {   // drawn once per question (see tests/test_no_flicker.py)
    lastQ = key;
    $("q").hidden = !q;
    $("q").innerHTML = q ? questionHtml(q) : "";
    clearInterval(camTimer); camTimer = null;
    if (q && $("cam")) {
      const tick = () => { const img = new Image(); img.onload = () => { if ($("cam")) $("cam").src = img.src; }; img.src = "/api/camera.jpg?t=" + Date.now(); };
      tick(); camTimer = setInterval(tick, 150);
    }
  }
  applyHold(s);
  tellHeight();
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b && b.id === "expand") { post("/api/window", { mode: "full" }); return; }
  if (b && b.dataset.answer) { post("/api/answer", { kind: b.dataset.answer }); return; }
  if (b && b.dataset.pick) { post("/api/answer", { kind: "pick", value: Number(b.dataset.pick) }); return; }
  if (e.target.closest("#top") && S) post("/api/handsfree", { on: !(S.window && S.window.hands_free) });   // click: stop / listen again
});
// Tooltip for the icon button: after ~half a second of hover, or at once on keyboard focus.
let tipTimer = null;
function showTip(b, delay) {
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => {
    const t = $("tip"), box = $("box").getBoundingClientRect(), r = b.getBoundingClientRect();
    t.textContent = b.dataset.tip; t.hidden = false;
    t.style.top = (r.top - box.top + r.height / 2 - t.offsetHeight / 2) + "px";
    t.style.left = (r.left - box.left - t.offsetWidth - 6) + "px";
  }, delay);
}
function hideTip() { clearTimeout(tipTimer); $("tip").hidden = true; }
$("expand").addEventListener("mouseenter", (e) => showTip(e.currentTarget, 500));
$("expand").addEventListener("mouseleave", hideTip);
$("expand").addEventListener("focus", (e) => { if (e.currentTarget.matches(":focus-visible")) showTip(e.currentTarget, 0); });
$("expand").addEventListener("blur", hideTip);
function connect() {
  const source = new EventSource("/api/stream");
  source.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "level") { $("level").style.width = Math.max(0, Math.min(100, (msg.level + 60) * 1.8)) + "%"; return; }
    if (msg.state) render(msg.state);
  };
  source.onerror = () => { source.close(); setTimeout(connect, 1000); };
}
fetch("/api/state").then((r) => r.json()).then(render).catch(() => {});
connect();
</script>
</body>
</html>
